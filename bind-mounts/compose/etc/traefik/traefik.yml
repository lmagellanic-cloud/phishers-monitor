api:
  # Dashboard
  #
  # Optional
  # Default: true
  #
  dashboard: true
  insecure: true

## Static configuration
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

providers:
  # Enable the file provider to define routers / middlewares / services in file
  file:
    filename: "/etc/traefik/dynamic/default.yml"

log:
  level: INFO
  format: common

accesslog:
  format: common
