services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    environment:
      APP_HOST: "${APP_HOST:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock:ro
      - ./bind-mounts/compose/etc/traefik:/etc/traefik
    restart: unless-stopped
    networks:
      - web

  traefik-whoami:
    # A container that exposes an API to show its IP address
    image: traefik/whoami
    container_name: traefik-whoami
    networks:
      - web

  django:
    image: phisher-monitor-django:v${VERSION}
    pull_policy: build
    container_name: phisher-monitor-django
    userns_mode: keep-id
    user: "${DJANGO_UID:-1000}:${DJANGO_GID:-1000}"
    build:
      context: .
      dockerfile: django_backend/Dockerfile
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "${APP_HOST:-localhost},django,127.0.0.1"
      DJANGO_DB_PATH: /bind-mounts/db.sqlite3
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
    volumes:
      - type: bind
        source: ./bind-mounts
        target: /bind-mounts
      - type: bind
        source: ${MEDIA_FOLDER_BIND_MOUNT}
        target: /django_backend/media/
    restart: no
    networks:
      - web

  react:
    image: phisher-monitor-react:v${VERSION}
    pull_policy: build
    container_name: phisher-monitor-react
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
      args:
        APP_HOST: "${APP_HOST:-localhost}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DJANGO_API_TARGET: http://django:8000
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
    depends_on:
      - django
    restart: no
    networks:
      - web

  beszel:
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=https://beszel.${APP_HOST:-localhost}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./bind-mounts/compose/beszel/beszel_data:/beszel_data
    networks:
      - web

  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    profiles:
      - monitoring
    restart: unless-stopped
    network_mode: host
    depends_on:
      - beszel
    volumes:
      - ./bind-mounts/compose/beszel/beszel-agent:/var/lib/beszel-agent
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: "45876"
      KEY: "${BESZEL_KEY:-}"
      TOKEN: "${BESZEL_TOKEN:-}"
      HUB_URL: http://127.0.0.1:8090
      DOCKER_HOST: unix:///var/run/docker.sock

networks:
  web:

volumes: {}